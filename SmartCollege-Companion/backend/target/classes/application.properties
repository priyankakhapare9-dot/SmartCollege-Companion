spring.application.name=smartcollege
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/smartcollege?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-to-at-least-32-bytes}
app.jwt.expiration-ms=86400000
app.upload.dir=uploads
app.ollama.url=${OLLAMA_URL:http://localhost:11434}
app.ollama.model=${OLLAMA_MODEL:llama3.2}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
